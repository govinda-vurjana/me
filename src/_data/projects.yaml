- title: Double DQN agent for a survival game
  year: 2025
  repo: https://github.com/govinda-vurjana/ZombieGame
  summary: A zombie-shooter environment in which an agent learns to move, aim, and survive using Double Deep Q-Networks.
  tags: [deep RL, DQN]

- title: SmartTrade
  year: 2025
  repo: https://github.com/govinda-vurjana/smart-trade
  summary: A modular platform for training and evaluating trading agents. PPO, DQN and actor-critic methods are implemented from scratch in PyTorch, with LSTM layers for temporal structure and custom reward shaping.
  tags: [RL, PyTorch, LSTM]
