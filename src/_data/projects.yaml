# Things built along the way. Newest first.
# Fields: title, year, summary, repo, tags, and optionally
#   inquiry: <slug>      to show the project on that inquiry's page
#   also:                extra links, each with label + url

- title: CAD drawings to editable 3D models
  year: 2026
  repo: https://github.com/govinda-vurjana/ai-3d-modelling
  summary: Turns client CAD drawings (.dxf) into editable Blender models, driven from the terminal in natural language. Claude Code acts as the agent, working through Blender over MCP and a from-scratch ingestion library that compiles each drawing into an intermediate build plan.
  tags: [3D, agents, Blender]

- title: Local image and text to video
  year: 2026
  repo: https://github.com/govinda-vurjana/OpenSourceModels_Experiments
  summary: A small FastAPI service over ComfyUI for running open video-generation models locally (Wan 2.2, HunyuanVideo 1.5, LTX) behind one plain HTTP interface.
  tags: [generative video, diffusion]

- title: Reinforcement-learning tasks for LLM agents
  year: 2025
  repo: https://github.com/govinda-vurjana/AiChamp-RLTask
  summary: Graded environments for training language-model agents with reinforcement learning, such as repairing a broken data-preprocessing pipeline. Each task is calibrated to a 10–40% pass rate so it stays learnable.
  tags: [RL, LLM agents, evaluation]
  also:
    - label: Data-drift task
      url: https://github.com/govinda-vurjana/Ai-Champ-Data-Drift
    - label: Trading-strategy task
