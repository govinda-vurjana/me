<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" height="310" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" role="img">
  <title>One neuron as a computational graph, with values computed forward and gradients passed backward</title>
  <style>
    text { fill: #8a8478; }
    .axis { stroke: #8a8478; stroke-width: 1; opacity: 0.7; }
    .grid { stroke: #8a8478; stroke-width: 1; opacity: 0.18; }
    .curve { fill: none; stroke: #8a8478; stroke-width: 2.2; }
    .thin { fill: none; stroke: #8a8478; stroke-width: 1.3; }
    .dash { fill: none; stroke: #8a8478; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .hl { fill: none; stroke: #b4502f; stroke-width: 2.2; }
    .hl-thin { fill: none; stroke: #b4502f; stroke-width: 1.4; }
    .hl-dash { fill: none; stroke: #b4502f; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .hl-text { fill: #b4502f; }
    .dot { fill: #8a8478; }
    .hl-dot { fill: #b4502f; }
    .hollow { fill: none; stroke: #8a8478; stroke-width: 1.5; }
    .box { fill: #8a8478; fill-opacity: 0.08; stroke: #8a8478; stroke-width: 1.3; }
    .big { font-size: 15px; }
    .small { font-size: 11px; }
  </style>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8478"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4502f"/></marker></defs>
<rect class="box" x="30" y="46" width="84" height="30" rx="5"/>
<text x="72" y="65" text-anchor="middle">w = 0.5</text>
<rect class="box" x="30" y="136" width="84" height="30" rx="5"/>
<text x="72" y="155" text-anchor="middle">x = 2</text>
<rect class="box" x="30" y="226" width="84" height="30" rx="5"/>
<text x="72" y="245" text-anchor="middle">b = 0</text>
<rect class="box" x="210" y="126" width="116" height="50" rx="5"/>
<text x="268" y="145" text-anchor="middle">u = wx + b</text>
<text class="small" x="268" y="162" text-anchor="middle">= 1</text>
<rect class="box" x="400" y="126" width="92" height="50" rx="5"/>
<text x="446" y="145" text-anchor="middle">v = u²</text>
<text class="small" x="446" y="162" text-anchor="middle">= 1</text>
<rect class="box" x="566" y="126" width="108" height="50" rx="5"/>
<text x="620" y="145" text-anchor="middle">L = (v − y)²</text>
<text class="small" x="620" y="162" text-anchor="middle">= 4</text>
<rect class="box" x="585" y="36" width="70" height="30" rx="5"/>
<text x="620" y="55" text-anchor="middle">y = 3</text>
<line class="thin" x1="114" y1="64" x2="206" y2="136" marker-end="url(#f)"/>
<line class="thin" x1="114" y1="151" x2="206" y2="151" marker-end="url(#f)"/>
<line class="thin" x1="114" y1="238" x2="206" y2="166" marker-end="url(#f)"/>
<line class="thin" x1="326" y1="151" x2="396" y2="151" marker-end="url(#f)"/>
<line class="thin" x1="492" y1="151" x2="562" y2="151" marker-end="url(#f)"/>
<line class="thin" x1="620" y1="66" x2="620" y2="122" marker-end="url(#f)"/>
<line class="hl-dash" x1="600" y1="212" x2="455" y2="212" marker-end="url(#b)"/>
<line class="hl-dash" x1="440" y1="212" x2="280" y2="212" marker-end="url(#b)"/>
<text class="hl-text small" x="620" y="198" text-anchor="middle">start at L</text>
<text class="hl-text" x="446" y="234" text-anchor="middle">∂L/∂v = −4</text>
<text class="hl-text" x="268" y="234" text-anchor="middle">∂L/∂u = −8</text>
<text class="hl-text small" x="530" y="204" text-anchor="middle">× 2(v − y)</text>
<text class="hl-text small" x="360" y="204" text-anchor="middle">× 2u</text>
<text class="hl-text" x="30" y="32">∂L/∂w = −8 × x = −16</text>
<text class="hl-text" x="30" y="280">∂L/∂b = −8 × 1 = −8</text>
<line class="thin" x1="270" y1="34" x2="302" y2="34" marker-end="url(#f)"/>
<text x="310" y="38">forward pass: values</text>
<line class="hl-dash" x1="302" y1="56" x2="270" y2="56" marker-end="url(#b)"/>
<text class="hl-text" x="310" y="60">backward pass: gradients</text>
</svg>
