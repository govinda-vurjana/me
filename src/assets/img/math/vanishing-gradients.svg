<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" role="img">
  <title>On a log scale, a product of 20 rates of 1.5 grows to about 3300 while a product of 20 rates of 0.5 shrinks to about one millionth</title>
  <style>
    text { fill: #8a8478; }
    .axis { stroke: #8a8478; stroke-width: 1; opacity: 0.7; }
    .grid { stroke: #8a8478; stroke-width: 1; opacity: 0.18; }
    .curve { fill: none; stroke: #8a8478; stroke-width: 2.2; }
    .thin { fill: none; stroke: #8a8478; stroke-width: 1.3; }
    .dash { fill: none; stroke: #8a8478; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .hl { fill: none; stroke: #b4502f; stroke-width: 2.2; }
    .hl-thin { fill: none; stroke: #b4502f; stroke-width: 1.4; }
    .hl-dash { fill: none; stroke: #b4502f; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .hl-text { fill: #b4502f; }
    .dot { fill: #8a8478; }
    .hl-dot { fill: #b4502f; }
    .hollow { fill: none; stroke: #8a8478; stroke-width: 1.5; }
    .box { fill: #8a8478; fill-opacity: 0.08; stroke: #8a8478; stroke-width: 1.3; }
    .big { font-size: 15px; }
    .small { font-size: 11px; }
  </style>
<line class="grid" x1="80" y1="40" x2="560" y2="40"/>
<text class="small" x="72" y="44" text-anchor="end">10<tspan dy="-5" font-size="9">4</tspan><tspan dy="5"></tspan></text>
<line class="grid" x1="80" y1="88" x2="560" y2="88"/>
<text class="small" x="72" y="92" text-anchor="end">10<tspan dy="-5" font-size="9">2</tspan><tspan dy="5"></tspan></text>
<line class="grid" x1="80" y1="136" x2="560" y2="136"/>
<text class="small" x="72" y="140" text-anchor="end">1</text>
<line class="grid" x1="80" y1="184" x2="560" y2="184"/>
<text class="small" x="72" y="188" text-anchor="end">10<tspan dy="-5" font-size="9">-2</tspan><tspan dy="5"></tspan></text>
<line class="grid" x1="80" y1="232" x2="560" y2="232"/>
<text class="small" x="72" y="236" text-anchor="end">10<tspan dy="-5" font-size="9">-4</tspan><tspan dy="5"></tspan></text>
<line class="grid" x1="80" y1="280" x2="560" y2="280"/>
<text class="small" x="72" y="284" text-anchor="end">10<tspan dy="-5" font-size="9">-6</tspan><tspan dy="5"></tspan></text>
<text class="small" x="80" y="298" text-anchor="middle">0</text>
<text class="small" x="200" y="298" text-anchor="middle">5</text>
<text class="small" x="320" y="298" text-anchor="middle">10</text>
<text class="small" x="440" y="298" text-anchor="middle">15</text>
<text class="small" x="560" y="298" text-anchor="middle">20</text>
<text x="560" y="316" text-anchor="end">layers the gradient passes back through</text>
<text x="72" y="24" text-anchor="end">size</text>
<polyline class="hl" points="80,136 104,131.8 128,127.5 152,123.3 176,119.1 200,114.9 224,110.6 248,106.4 272,102.2 296,98 320,93.7 344,89.5 368,85.3 392,81.1 416,76.8 440,72.6 464,68.4 488,64.2 512,59.9 536,55.7 560,51.5"/>
<polyline class="dash" points="80,136 104,136 128,136 152,136 176,136 200,136 224,136 248,136 272,136 296,136 320,136 344,136 368,136 392,136 416,136 440,136 464,136 488,136 512,136 536,136 560,136"/>
<polyline class="curve" points="80,136 104,143.2 128,150.4 152,157.7 176,164.9 200,172.1 224,179.3 248,186.6 272,193.8 296,201 320,208.2 344,215.5 368,222.7 392,229.9 416,237.1 440,244.4 464,251.6 488,258.8 512,266 536,273.3 560,280.5"/>
<text class="hl-text" x="568" y="55.5">× 1.5 each layer</text>
<text class="hl-text small" x="568" y="70.5">≈ 3300: explodes</text>
<text x="568" y="140">× 1: stays 1</text>
<text x="568" y="276.5">× 0.5 each layer</text>
<text class="small" x="568" y="291.5">≈ 0.000001: vanishes</text>
</svg>
