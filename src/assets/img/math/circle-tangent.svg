<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 410" width="420" height="410" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" role="img">
  <title>The circle x squared plus y squared equals 25, with the radius to the point (3, 4) and the tangent there at right angles to it</title>
  <style>
    text { fill: #8a8478; }
    .axis { stroke: #8a8478; stroke-width: 1; opacity: 0.7; }
    .grid { stroke: #8a8478; stroke-width: 1; opacity: 0.18; }
    .curve { fill: none; stroke: #8a8478; stroke-width: 2.2; }
    .thin { fill: none; stroke: #8a8478; stroke-width: 1.3; }
    .dash { fill: none; stroke: #8a8478; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .hl { fill: none; stroke: #b4502f; stroke-width: 2.2; }
    .hl-thin { fill: none; stroke: #b4502f; stroke-width: 1.4; }
    .hl-dash { fill: none; stroke: #b4502f; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .hl-text { fill: #b4502f; }
    .dot { fill: #8a8478; }
    .hl-dot { fill: #b4502f; }
    .hollow { fill: none; stroke: #8a8478; stroke-width: 1.5; }
    .box { fill: #8a8478; fill-opacity: 0.08; stroke: #8a8478; stroke-width: 1.3; }
    .big { font-size: 15px; }
    .small { font-size: 11px; }
  </style>
<line class="grid" x1="25" y1="205" x2="385" y2="205"/>
<line class="grid" x1="205" y1="385" x2="205" y2="16"/>
<circle class="curve" cx="205" cy="205" r="150"/>
<text x="103" y="343" text-anchor="end">x² + y² = 25</text>
<line class="thin" x1="205" y1="205" x2="295" y2="85"/>
<circle class="dot" cx="205" cy="205" r="3"/>
<text x="236.5" y="134.5" text-anchor="end">radius</text>
<text x="236.5" y="149.5" text-anchor="end">slope 4/3</text>
<line class="hl" x1="232.6" y1="38.2" x2="364.6" y2="137.2"/>
<text class="hl-text" x="382" y="161" text-anchor="middle">tangent</text>
<text class="hl-text" x="382" y="176" text-anchor="middle">slope −3/4</text>
<path class="thin" d="M286.9,95.8 L297.7,103.9 L305.8,93.1"/>
<circle class="hl-dot" cx="295" cy="85" r="4.5"/>
<text class="hl-text" x="302.5" y="74.5">(3, 4)</text>
<text class="small" x="28" y="28">−3/4 × 4/3 = −1: perpendicular</text>
</svg>
